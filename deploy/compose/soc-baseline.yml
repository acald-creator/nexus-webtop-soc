services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.5
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - soc-net
    ports:
      - "9200:9200"

  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: wazuh.manager
    hostname: wazuh.manager
    depends_on:
      - wazuh.indexer
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - SSL_CERTIFICATE_AUTHORITIES=
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-logs:/var/ossec/logs
    networks:
      - soc-net
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=admin
      - SERVER_SSL_ENABLED=false
    networks:
      - soc-net
    ports:
      - "5601:5601"

  suricata.sensor:
    image: jasonish/suricata:7.0
    container_name: suricata.sensor
    hostname: suricata.sensor
    command:
      - -i
      - eth0
      - -c
      - /etc/suricata/suricata.yaml
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - suricata-logs:/var/log/suricata
    networks:
      - soc-net
    restart: unless-stopped

  suricata.forwarder:
    image: busybox:1.36
    container_name: suricata.forwarder
    hostname: suricata.forwarder
    depends_on:
      - suricata.sensor
      - wazuh.manager
    command:
      - /bin/sh
      - -c
      - |
        touch /var/log/suricata/eve.json
        tail -F /var/log/suricata/eve.json | nc -u wazuh.manager 1514
    volumes:
      - suricata-logs:/var/log/suricata
    networks:
      - soc-net
    restart: unless-stopped

  webtop.analyst:
    image: ${WEBTOP_ANALYST_IMAGE:-nexus-webtop-workbench:local}
    container_name: webtop.analyst
    hostname: webtop.analyst
    profiles:
      - analyst
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - webtop-analyst-config:/config
      - soc-shared:/soc-shared
    networks:
      - soc-net
    ports:
      - "3000:3000"

networks:
  soc-net:
    driver: bridge

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-manager-etc:
  wazuh-manager-logs:
  suricata-logs:
  webtop-analyst-config:
  soc-shared:
