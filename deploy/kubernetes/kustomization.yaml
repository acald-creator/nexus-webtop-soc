apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexus-soc
resources:
  - namespace.yaml
  - phase2-placeholder-configmap.yaml
  - soc-runtime-phase2.yaml
configMapGenerator:
  - name: suricata-config
    files:
      - suricata.yaml=suricata.yaml
generatorOptions:
  disableNameSuffixHash: true
